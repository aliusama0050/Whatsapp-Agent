services:
  backend:
    build: .
    container_name: hsq-backend
    env_file: .env
    environment:
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hsq-network

  frontend:
    build: ./frontend
    container_name: hsq-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - hsq-network

networks:
  hsq-network:
    driver: bridge
